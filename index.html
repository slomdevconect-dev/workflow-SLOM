<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow SLOM</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="assets/app.css?v=6">
</head>
<body>
<div id="auth" class="auth" hidden>
  <form id="authForm" class="auth-card" novalidate>
    <div class="logo-plate"><img src="assets/img/logo-h.png" alt="SLOM DEV"></div>
    <div class="brand">Workflow<span>SLOM</span></div>
    <h2 id="authTitle"></h2>
    <p id="authMsg" class="muted"></p>
    <label data-f="name" hidden>Nome<input id="aName" autocomplete="name" maxlength="80"></label>
    <label data-f="email">E-mail<input id="aEmail" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label data-f="pass">Senha<input id="aPass" type="password" autocomplete="current-password"></label>
    <label data-f="pass2" hidden>Confirmar senha<input id="aPass2" type="password" autocomplete="new-password"></label>
    <div id="authErr" class="err" role="alert"></div>
    <button class="btn primary" id="authBtn"></button>
    <button type="button" class="btn" id="resendBtn" hidden>Reenviar e-mail de confirmação</button>
    <div class="auth-links">
      <button type="button" class="link" id="lnkForgot">Esqueci minha senha</button>
      <button type="button" class="link" id="lnkSwitch"></button>
    </div>
  </form>
</div>

<div id="app" class="app" hidden>
  <main class="main">
    <div id="banner" class="banner" hidden><img class="pi" src="assets/img/icons/bell.png" alt=""><span>Confirme seu e-mail para proteger a conta e poder recuperar a senha.</span><button class="btn" id="bannerBtn">Confirmar e-mail</button></div>
    <header class="top">
      <div id="crumbs" class="crumbs"></div>
      <span id="status" class="status"></span>
      <button class="icon menu" id="menuBtn" aria-label="Abrir menu" data-i="menu"></button>
    </header>
    <section id="view" class="view"></section>
  </main>
  <div id="scrim" class="scrim"></div>
  <aside id="side" class="side" aria-label="Menu">
    <div class="side-head">
      <button class="icon" id="collapseBtn" aria-label="Recolher menu"></button>
      <img class="side-logo" src="assets/img/logo-app.png" alt="SLOM DEV">
      <div class="who"><b>Workflow SLOM</b><small id="meName"></small></div>
    </div>
    <div class="side-actions">
      <button class="nav" id="homeBtn" title="Início"><img class="ni" src="assets/img/icons/home.png" alt=""><span>Início</span></button>
      <button class="nav primary" id="newRoot" title="Nova página"><img class="ni" src="assets/img/icons/add.png" alt=""><span>Nova página</span></button>
      <button class="nav" id="searchBtn" title="Buscar"><img class="ni" src="assets/img/icons/search.png" alt=""><span>Buscar</span></button>
      <button class="nav" id="graphBtn" title="Grafo de ideias"><img class="ni" src="assets/img/icons/share.png" alt=""><span>Grafo de ideias</span></button>
    </div>
    <input id="search" class="search" placeholder="Buscar páginas…" type="search" aria-label="Buscar páginas">
    <nav id="tree" class="tree"></nav>
    <div class="side-foot">
      <button class="nav" id="trashBtn" title="Lixeira"><img class="ni" src="assets/img/icons/trash.png" alt=""><span>Lixeira</span></button>
      <button class="nav" id="usersBtn" title="Administração" hidden><img class="ni" src="assets/img/icons/team.png" alt=""><span>Administração</span></button>
      <button class="nav" id="mailBtn" title="E-mail da conta"><img class="ni" src="assets/img/icons/shield.png" alt=""><span>E-mail da conta</span></button>
      <button class="nav" id="pwBtn" title="Alterar senha"><img class="ni" src="assets/img/icons/lock.png" alt=""><span>Alterar senha</span></button>
      <button class="nav" id="themeBtn" title="Aparência"><img class="ni" id="themeIcon" src="assets/img/icons/moon.png" alt=""><span>Aparência</span></button>
      <button class="nav" id="logoutBtn" title="Sair"><img class="ni" src="assets/img/icons/external.png" alt=""><span>Sair</span></button>
    </div>
  </aside>
</div>

<div id="slash" class="slash" hidden></div>
<dialog id="dlg" class="dlg"></dialog>
<script src="assets/app.js?v=6"></script>
</body>
</html>
