<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow SLOM</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fed'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css?v=4">
</head>
<body>
<div id="auth" class="auth" hidden>
  <form id="authForm" class="auth-card" novalidate>
    <div class="brand">Workflow<span>SLOM</span></div>
    <h2 id="authTitle"></h2>
    <p id="authMsg" class="muted"></p>
    <label data-f="name" hidden>Nome<input id="aName" autocomplete="name" maxlength="80"></label>
    <label data-f="email">E-mail<input id="aEmail" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label data-f="pass">Senha<input id="aPass" type="password" autocomplete="current-password"></label>
    <label data-f="pass2" hidden>Confirmar senha<input id="aPass2" type="password" autocomplete="new-password"></label>
    <div id="authErr" class="err" role="alert"></div>
    <button class="btn primary" id="authBtn"></button>
    <button type="button" class="btn" id="resendBtn" hidden>Reenviar e-mail de confirmação</button>
    <div class="auth-links">
      <button type="button" class="link" id="lnkForgot">Esqueci minha senha</button>
      <button type="button" class="link" id="lnkSwitch"></button>
    </div>
  </form>
</div>

<div id="app" class="app" hidden>
  <main class="main">
    <div id="banner" class="banner" hidden><span>Confirme seu e-mail para proteger a conta e poder recuperar a senha.</span><button class="btn" id="bannerBtn">Confirmar e-mail</button></div>
    <header class="top">
      <div id="crumbs" class="crumbs"></div>
      <span id="status" class="status"></span>
      <button class="icon menu" id="menuBtn" aria-label="Abrir menu" data-i="menu"></button>
    </header>
    <section id="view" class="view"></section>
  </main>
  <div id="scrim" class="scrim"></div>
  <aside id="side" class="side" aria-label="Menu">
    <div class="side-head">
      <button class="icon" id="collapseBtn" aria-label="Recolher menu"></button>
      <div class="who"><b>Workflow SLOM</b><small id="meName"></small></div>
    </div>
    <div class="side-actions">
      <button class="nav primary" id="newRoot" title="Nova página"><i data-i="plus"></i><span>Nova página</span></button>
      <button class="nav" id="searchBtn" title="Buscar"><i data-i="search"></i><span>Buscar</span></button>
      <button class="nav" id="graphBtn" title="Grafo de ideias"><i data-i="graph"></i><span>Grafo de ideias</span></button>
    </div>
    <input id="search" class="search" placeholder="Buscar páginas…" type="search" aria-label="Buscar páginas">
    <nav id="tree" class="tree"></nav>
    <div class="side-foot">
      <button class="nav" id="trashBtn" title="Lixeira"><i data-i="trash"></i><span>Lixeira</span></button>
      <button class="nav" id="usersBtn" title="Usuários" hidden><i data-i="users"></i><span>Usuários</span></button>
      <button class="nav" id="mailBtn" title="E-mail da conta"><i data-i="mail"></i><span>E-mail da conta</span></button>
      <button class="nav" id="pwBtn" title="Alterar senha"><i data-i="key"></i><span>Alterar senha</span></button>
      <button class="nav" id="themeBtn" title="Aparência"><i data-i="palette"></i><span>Aparência</span></button>
      <button class="nav" id="logoutBtn" title="Sair"><i data-i="logout"></i><span>Sair</span></button>
    </div>
  </aside>
</div>

<div id="slash" class="slash" hidden></div>
<dialog id="dlg" class="dlg"></dialog>
<script src="assets/app.js?v=4"></script>
</body>
</html>
